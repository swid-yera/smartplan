name: eduplan

services:
  ui:
    container_name: ui
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_RENDER_API_URL: ${NEXT_PUBLIC_RENDER_API_URL:-http://localhost:8000}
        GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    restart: unless-stopped
    env_file:
      - ../../frontend/.env.local
    depends_on:
      api:
        condition: service_started
      render:
        condition: service_started
    ports:
      - "3000:3000"
    networks:
      - app-network

  api:
    container_name: api
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../backend/.env
    environment:
      SERVER_PORT: "8080"
      DB_HOST: postgres
      REDIS_ADDR: redis:6379
      DOCUMENT_RENDER_URL: http://render:8000
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      render:
        condition: service_started
    ports:
      - "8080:8080"
    networks:
      - app-network

  render:
    container_name: render 
    build:
      context: ../../document-rendering-service
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../../document-rendering-service/.env.local
    ports:
      - "8000:8000"
    networks:
      - app-network

  redis:
    container_name: redis
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_eduplan_data:/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    container_name: db
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: eduplan
    ports:
      - "5432:5432"
    volumes:
      - db_eduplan_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d eduplan" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  db_eduplan_data:
  redis_eduplan_data:
