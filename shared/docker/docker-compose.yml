name: eduplan

services:
   ui:
      container_name: eduplan-ui
      build:
         context: ../../frontend
         dockerfile: Dockerfile
         args:
            NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
            NEXT_PUBLIC_RENDER_API_URL: ${NEXT_PUBLIC_RENDER_API_URL:-http://localhost:8081}
            GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      restart: unless-stopped
      env_file:
         - ../../frontend/.env.local
      depends_on:
         api:
            condition: service_started
         render:
            condition: service_started
      ports:
         - '3000:3000'
      networks:
         - app-network

   api:
      container_name: eduplan-api
      build:
         context: ../../backend
         dockerfile: Dockerfile
      restart: unless-stopped
      env_file:
         - ../../backend/.env
      environment:
         SERVER_PORT: '8080'
         DB_HOST: db
         REDIS_ADDR: redis:6379
         DOCUMENT_RENDER_URL: http://render:8081
         TRANSLATION_BASE_URL: http://translation-service:8082
         DB_SSLMODE: disable
      extra_hosts:
         - 'host.docker.internal:192.168.65.254'
      depends_on:
         db:
            condition: service_healthy
         redis:
            condition: service_healthy
         render:
            condition: service_started
         translation-service:
            condition: service_healthy
      ports:
         - '8080:8080'
      networks:
         - app-network

   render:
      container_name: eduplan-render
      build:
         context: ../../document-rendering-service
         dockerfile: Dockerfile
      restart: unless-stopped
      env_file:
         - ../../document-rendering-service/.env.local
      ports:
         - '8081:8081'
      networks:
         - app-network

   translation-service:
      container_name: eduplan-translation-service
      build:
         context: ../../translation-service
         dockerfile: Dockerfile
      restart: unless-stopped
      environment:
         REDIS_URL: redis://redis:6379/0
         NLLB_MODEL_PATH: /models/nllb-200-distilled-600M-ct2-int8
         NLLB_TOKENIZER_NAME: /models/nllb-200-distilled-600M-ct2-int8
         TRANSLATION_MODEL_NAME: nllb-200-distilled-600M-ct2-int8
         TRANSLATION_COMPUTE_TYPE: int8
         TRANSLATION_CACHE_TTL_SECONDS: '2592000'
      volumes:
         - ../../models/translation:/models:ro
      ports:
         - '8082:8082'
      depends_on:
         redis:
            condition: service_healthy
      healthcheck:
         test:
            [
               'CMD-SHELL',
               'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8082/health'', timeout=5).read()"',
            ]
         interval: 20s
         timeout: 10s
         retries: 6
         start_period: 20s
      networks:
         - app-network

   translation-model-prepare:
      container_name: eduplan-translation-model-prepare
      build:
         context: ../../translation-service
         dockerfile: Dockerfile.model
      profiles:
         - tools
      environment:
         TRANSLATION_MODEL_NAME: nllb-200-distilled-600M-ct2-int8
         NLLB_MODEL_OUTPUT_DIR: /models/nllb-200-distilled-600M-ct2-int8
      volumes:
         - ../../models/translation:/models

   redis:
      container_name: eduplan-redis
      image: redis:7-alpine
      restart: unless-stopped
      ports:
         - '6379:6379'
      volumes:
         - redis_eduplan_data:/data
      networks:
         - app-network
      healthcheck:
         test: ['CMD', 'redis-cli', 'ping']
         interval: 10s
         timeout: 5s
         retries: 5

   db:
      container_name: eduplan-db
      image: postgres:16
      restart: unless-stopped
      environment:
         POSTGRES_USER: admin
         POSTGRES_PASSWORD: admin
         POSTGRES_DB: eduplan
      ports:
         - '5432:5432'
      volumes:
         - db_eduplan_data:/var/lib/postgresql/data
      networks:
         - app-network
      healthcheck:
         test: ['CMD-SHELL', 'pg_isready -U admin -d eduplan']
         interval: 10s
         timeout: 5s
         retries: 5

networks:
   app-network:
      driver: bridge

volumes:
   db_eduplan_data:
   redis_eduplan_data:
