openapi: 3.0.3
info:
  title: Educational Platform API
  description: API для управления учебными планами (RUP), пользователями, группами и наградами.
  version: 1.1.0

servers:
  - url: https://api.example.com/v1
    description: Production server

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # --- ENUMS ---
    RoleEnum:
      type: string
      enum: [Teachers, Methodists, Admins]
    StatusEnum:
      type: string
      enum: [DRAFT, IN_REVIEW, APPROVED, REJECTED]
    StudyFormEnum:
      type: string
      enum: [CORRESPONDENCE, FULL_TIME]
    RupTypeEnum:
      type: string
      enum: [PRACTICE, THEORY]
    TopicTypeEnum:
      type: string
      enum: [SNZ, PRACTICAL, COMBINED]
    ResourceTypeEnum:
      type: string
      enum: [INTERNET, TECHNICAL]
    AwardViolationEnum:
      type: string
      enum: [NONE, REMARK, REBUKE, SEVERE_REPRIMAND]
    AwardMethodEnum:
      type: string
      enum: [NORMAL, MEASURING, PENALTY]

    # --- ENTITIES ---

    # User
    User:
      type: object
      properties:
        keycloak_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        firstName:
          type: string
          nullable: true
        lastName:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        roles:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/RoleEnum'
        totalPoints:
          type: integer
          default: 0
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # Group
    Group:
      type: object
      properties:
        keycloak_id:
          type: string
          format: uuid
        name:
          type: string
        qualification:
          type: string
          nullable: true
        specialty:
          type: string
          nullable: true

    # Resource
    Resource:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        link:
          type: string
        type:
          $ref: '#/components/schemas/ResourceTypeEnum'

    # Exploration Note
    ExplorationNote:
      type: object
      properties:
        id:
          type: string
          format: uuid
        basis:
          type: string
        goals:
          type: string
        competencies:
          type: string
        prerequisites:
          type: string
        postrequisites:
          type: string
        internetResources:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Resource'
        technicalResources:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Resource'

    # Discipline Topic
    DisciplineTopic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          $ref: '#/components/schemas/TopicTypeEnum'
        totalHours:
          type: integer
        theoryHours:
          type: integer
        practiceHours:
          type: integer
        individualHours:
          type: integer
        srspHours:
          type: integer
        srsHours:
          type: integer

    # Discipline Semester
    DisciplineSemester:
      type: object
      properties:
        id:
          type: string
          format: uuid
        semester:
          type: integer
          description: From 1 to 8
        totalHours:
          type: integer

    # Discipline
    Discipline:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
          nullable: true
        totalHours:
          type: integer
        semesters:
          type: array
          maxItems: 8
          items:
            $ref: '#/components/schemas/DisciplineSemester'
        topics:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/DisciplineTopic'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # RUP
    Rup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        status:
          $ref: '#/components/schemas/StatusEnum'
        reason:
          type: string
          nullable: true
        course:
          type: integer
          description: From 1 to 4
        studyForm:
          $ref: '#/components/schemas/StudyFormEnum'
        studyYear:
          type: string
        type:
          $ref: '#/components/schemas/RupTypeEnum'
        totalHours:
          type: integer
        contacts:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/User'
        groups:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/Group'
        methodist:
          $ref: '#/components/schemas/User'
        teacher:
          $ref: '#/components/schemas/User'
        explorationNote:
          $ref: '#/components/schemas/ExplorationNote'
        disciplines:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/Discipline'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RupSignatureArtifact:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rupId:
          type: string
          format: uuid
        documentId:
          type: string
        documentVersion:
          type: string
          format: uuid
        documentHash:
          type: string
        keyId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        signature:
          type: string
        signerName:
          type: string
        signerRole:
          type: string
        signatureId:
          type: string
        verificationUrl:
          type: string
        qrSvg:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # --- AWARD RELATED ENTITIES ---

    # Award Type Criteria
    AwardTypeCriteria:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        points:
          type: integer
        method:
          $ref: '#/components/schemas/AwardMethodEnum'
        bonusName:
          type: string
          nullable: true
        bonusPoints:
          type: integer
          nullable: true
        bonusMethod:
          $ref: '#/components/schemas/AwardMethodEnum'

    # Award Type Variant
    AwardTypeVariant:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        criteria:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AwardTypeCriteria'

    # Award Type
    AwardType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        variants:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AwardTypeVariant'

    # Award (Full Object for Responses)
    Award:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/StatusEnum'
        reason:
          type: string
          nullable: true
        methodist:
          $ref: '#/components/schemas/User'
        totalPoints:
          type: integer
          default: 0
        violation:
          $ref: '#/components/schemas/AwardViolationEnum'
        type:
          $ref: '#/components/schemas/AwardType'
        teacher:
          $ref: '#/components/schemas/User'
        text:
          type: string
          nullable: true
        images:
          type: array
          maxItems: 10
          items:
            type: string
          description: URLs
        documents:
          type: array
          maxItems: 10
          items:
            type: string
          description: URLs
        links:
          type: array
          maxItems: 10
          items:
            type: string
          description: URLs
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # --- INPUT SCHEMAS ---

    # RUP Create Input
    RupInput:
      type: object
      required: [name, code, type, studyYear, course, studyForm]
      properties:
        name:
          type: string
        code:
          type: string
        type:
          $ref: '#/components/schemas/RupTypeEnum'
        studyYear:
          type: string
        course:
          type: integer
        studyForm:
          $ref: '#/components/schemas/StudyFormEnum'
        contacts:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              keycloak_id: { type: string, format: uuid }
        groups:
          type: array
          maxItems: 10
          items:
            type: object
            properties:
              keycloak_id: { type: string, format: uuid }
        methodist:
          type: object
          properties:
            keycloak_id: { type: string, format: uuid }
        teacher:
          type: object
          properties:
            keycloak_id: { type: string, format: uuid }
        explorationNote:
          type: object
          properties:
            basis:
              type: string
            goals:
              type: string
            competencies:
              type: string
            prerequisites:
              type: string
            postrequisites:
              type: string
            internetResources:
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/Resource'
            technicalResources:
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/Resource'
        disciplines:
          type: array
          maxItems: 20
          items:
            type: object
            properties:
              name:
                type: string
              code:
                type: string
              semesters:
                type: array
                maxItems: 8
                items:
                  $ref: '#/components/schemas/DisciplineSemester'
              topics:
                type: array
                maxItems: 50
                items:
                  $ref: '#/components/schemas/DisciplineTopic'

    UpdateRupStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        reason:
          type: string
        key_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        password:
          type: string
        confirmed:
          type: boolean
        signature:
          type: string
          description: Hex-encoded signature extracted from .kripto

    UpdateRupStatusResponse:
      type: object
      properties:
        message:
          type: string
        artifact:
          $ref: '#/components/schemas/RupSignatureArtifact'

    # Award Input (For POST/PUT)
    AwardInput:
      type: object
      required: [teacher_id, type_id]
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
        reason:
          type: string
        methodist_id:
          type: string
          format: uuid
        totalPoints:
          type: integer
        violation:
          $ref: '#/components/schemas/AwardViolationEnum'
        typeId:
          type: string
          format: uuid
        teacher_id:
          type: string
          format: uuid
        text:
          type: string
        images:
          type: array
          maxItems: 10
          items:
            type: string
        documents:
          type: array
          maxItems: 10
          items:
            type: string
        links:
          type: array
          maxItems: 10
          items:
            type: string

    # Award Type Criteria Input
    AwardTypeCriteriaInput:
      type: object
      properties:
        name:
          type: string
        points:
          type: integer
        method:
          $ref: '#/components/schemas/AwardMethodEnum'
        bonusName:
          type: string
          nullable: true
        bonusPoints:
          type: integer
          nullable: true
        bonusMethod:
          $ref: '#/components/schemas/AwardMethodEnum'

    # Award Type Variant Input
    AwardTypeVariantInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        criteria:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AwardTypeCriteriaInput'

    # Award Type Input
    AwardTypeInput:
      type: object
      properties:
        name:
          type: string
        variants:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/AwardTypeVariantInput'

    # Meta Pagination
    PaginationMeta:
      type: object
      properties:
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        pages:
          type: integer

    # Error
    ErrorResponse:
      type: object
      properties:
        error:
          type: string

paths:
  # === AUTH ===
  /login:
    get:
      tags: [Auth]
      summary: Redirect to Keycloak
      responses:
        '302':
          description: Redirect to Keycloak login

  /callback:
    get:
      tags: [Auth]
      summary: Keycloak callback
      responses:
        '302':
          description: Redirect to frontend with SID

  /logout:
    get:
      tags: [Auth]
      summary: Logout
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Successfully logged out
          content:
            application/json:
              example: { 'result': 'successfully logged out' }

  # === USERS ===
  /users/me:
    get:
      tags: [Users]
      summary: Get current user
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users:
    get:
      tags: [Users]
      summary: Get all users
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: search
          in: query
          schema: { type: string }
        - name: roles
          in: query
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RoleEnum'
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /users/{id}:
    get:
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    put:
      tags: [Users]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                username: { type: string }
                firstName: { type: string }
                lastName: { type: string }
                phone: { type: string }
                roles:
                  type: array
                  items:
                    $ref: '#/components/schemas/RoleEnum'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  # === GROUPS ===
  /groups:
    get:
      tags: [Groups]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: search
          in: query
          schema: { type: string }
        - name: specialty
          in: query
          schema: { type: string }
      responses:
        '200':
          description: List of groups
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Group'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

  /groups/{id}:
    get:
      tags: [Groups]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Group details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'
    put:
      tags: [Groups]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                qualification: { type: string }
                specialty: { type: string }
      responses:
        '200':
          description: Updated group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Group'

  # === RUPs ===
  /rups:
    get:
      tags: [RUPs]
      summary: Get list of RUPs
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: dateFrom
          in: query
          schema: { type: string }
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/StatusEnum'
        - name: type
          in: query
          explode: true
          schema:
            type: array
            items:
              $ref: '#/components/schemas/RupTypeEnum'
      responses:
        '200':
          description: Filtered RUPs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rup'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags: [RUPs]
      summary: Create RUP
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RupInput'
      responses:
        '200':
          description: Created RUP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rup'
        '400':
          description: Invalid data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /rups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [RUPs]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: RUP Detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rup'
        '404':
          description: Invalid UUID or not found
    put:
      tags: [RUPs]
      summary: Update RUP (Admin/Teacher self)
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  $ref: '#/components/schemas/RupInput'
      responses:
        '200':
          description: Updated RUP
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Rup'
    delete:
      tags: [RUPs]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: RUP deleted
          content:
            application/json:
              example: { 'result': 'rup deleted successfully' }

  /rups/{id}/status:
    put:
      tags: [RUPs]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRupStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateRupStatusResponse'

  /rups/{id}/signature-artifact:
    get:
      tags: [RUPs]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Latest QR/signature artifact for approved RUP
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RupSignatureArtifact'
        '404':
          description: Signature artifact not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # === AWARDS ===
  /awards:
    get:
      tags: [Awards]
      summary: Get list of awards
      description: Returns full objects for teacher, methodist, and type.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: teacher_id
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusEnum' }
      responses:
        '200':
          description: List of awards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Award'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'

    post:
      tags: [Awards]
      summary: Create award
      description: Provide IDs for related entities (teacher_id, type_id, etc.)
      security:
        - BearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwardInput'
      responses:
        '200':
          description: Award created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Award'
        '300':
          description: Invalid data
          content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'

  /awards/{id}:
    get:
      tags: [Awards]
      summary: Get award details
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Award details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Award'
        '300':
          description: Invalid uuid
          content:
             application/json:
               schema:
                 $ref: '#/components/schemas/ErrorResponse'
    put:
      tags: [Awards]
      summary: Update award
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AwardInput'
      responses:
        '200':
          description: Award updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Award'
    delete:
      tags: [Awards]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Award deleted
          content:
            application/json:
              example: { 'result': 'award deleted' }
        '300':
          description: Invalid uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # === AWARD TYPES ===
  /award-types:
    get:
      tags: [Award Types]
      summary: Get award types hierarchy
