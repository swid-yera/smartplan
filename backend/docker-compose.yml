version: '3.8'

services:
   appdb:
      image: postgres:15
      environment:
         POSTGRES_DB: eduplan
         POSTGRES_USER: eduplan
         POSTGRES_PASSWORD: eduplan
      ports:
         - '5433:5432'

   api:
      build: .
      ports:
         - '3000:8080'
      env_file:
         - .env
      depends_on:
         - appdb
