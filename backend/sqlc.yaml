version: "2"
sql:
  - engine: "postgresql"
    schema: "../shared/atlas/schema.sql"
    queries: "pkg/sqlc/queries.sql"
    gen:
      go:
        package: "sql"
        out: "pkg/sqlc/generated"
        emit_interface: true
        emit_json_tags: true
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
