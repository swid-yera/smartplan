services:
  redis:
    image: redis:7-alpine
    container_name: redis-eduplan
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_eduplan_data:/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: postgres-eduplan
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: eduplan
    ports:
      - "5432:5432"
    volumes:
      - postgres_eduplan_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d eduplan" ]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  minio_data:
  minio_config:
  postgres_eduplan_data:
  redis_eduplan_data:
