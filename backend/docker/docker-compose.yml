services:
  redis:
    image: redis:7-alpine
    container_name: redis-eduplan
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_eduplan_data:/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16
    container_name: postgres-eduplan
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: eduplan
    ports:
      - "5432:5432"
    volumes:
      - postgres_eduplan_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d eduplan" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
      image: minio/minio:RELEASE.2025-09-07T16-13-09Z
      container_name: docker-minio-1
      restart: always
      ports:
        - "9000:9000" # API
        - "9001:9001" # Web UI
      environment:
        MINIO_ROOT_USER: minio
        MINIO_ROOT_PASSWORD: minio123
      command: server /data --console-address ":9001"
      volumes:
        - minio_data:/data
      networks:
        - app-network
      healthcheck:
        test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
        interval: 10s
        timeout: 5s
        retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  minio_data:
  minio_config:
  postgres_eduplan_data:
  redis_eduplan_data:
