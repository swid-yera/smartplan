        "ru": "Сформировать у студентов общее представление об истории создания языка Python и его ключевых особенностях.",
        "kz": "Білім алушыларда Python тілінің құрылу тарихы мен негізгі ерекшеліктері туралы жалпы түсінік қалыптастыру."
