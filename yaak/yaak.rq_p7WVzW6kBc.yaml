        "ru": "Познакомить с предпосылками создания Python, раскрыть особенности синтаксиса и области применения языка.",
        "kz": "Python тілінің пайда болу алғышарттарымен таныстыру, синтаксис ерекшеліктері мен қолданылу салаларын ашып көрсету."
      },
      "expected": {
        "ru": "Студенты описывают историю Python, называют его особенности и объясняют основные области применения.",
        "kz": "Білім алушылар Python тарихын сипаттайды, оның ерекшеліктерін атайды және негізгі қолданылу салаларын түсіндіреді."
      },
