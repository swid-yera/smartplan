  text: "{\n\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\"name\": \"ПМ6 Обеспечение информационной безопасности локальных вычислительных сетей и Internet\",\n\t\"status\": \"APPROVED\",\n\t\"reason\": \"\",\n\t\"course\": 4,\n\t\"studyForm\": \"FULL_TIME\",\n\t\"studyYear\": \"2025-2026\",\n\t\"type\": \"PRACTICE\",\n\t\"totalHours\": 288,\n\t\"contacts\": [\n\t\t{\n\t\t\t\"keycloak_id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\"email\": \"contacts@asd.com\",\n\t\t\t\"username\": \"contacts\",\n\t\t\t\"firstName\": \"Динара \",\n\t\t\t\"lastName\": \"Кабдыгалиевна\",\n\t\t\t\"phone\": \"+77427483423\",\n\t\t\t\"roles\": [\"Teachers\"]\n\t\t}\n\t],\n\t\"group\": {\n\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\"name\": \"Т22-4Б\",\n\t\t\"specialty\": \"06120100 \\\"Вычислительная техника и информационные сети\\\" (по видам)\",\n\t\t\"qualification\": \"4S06120102 \\\"Техник сетевого системного администрирования\\\"\"\n\t},\n\t\"methodist\": {\n\t\t\"keycloak_id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\"email\": \"methodist@asdf.com\",\n\t\t\"username\": \"methodist\",\n\t\t\"firstName\": \"Галия\",\n\t\t\"lastName\": \"Асхатовна\",\n\t\t\"phone\": \"+77427483423\",\n\t\t\"roles\": [\"Methodists\"]\n\t},\n\t\"teacher\": {\n\t\t\"keycloak_id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\"email\": \"teacher@asdf.com\",\n\t\t\"username\": \"teacher\",\n\t\t\"firstName\": \"Сауле\",\n\t\t\"lastName\": \"Бактыбаевна\",\n\t\t\"phone\": \"+77237434323\",\n\t\t\"roles\": [\"Teachers\"]\n\t},\n\t\"explorationNote\": {\n\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\"basis\": \"Рабочая учебная программа по профессиональному модулю «ПМ6 Обеспечение информационной безопасности локальных вычислительных сетей и Internet» разработана на основе Приказа Министра просвещения Республики Казахстан от 3 августа 2022 года № 348 учитывая внесенные изменения от 15.04.2025 года, профессиональных стандартов ««Сетевые, системные администраторы и администраторы серверов» (дополнение №5 к приказу заместителя председателя правления Национальной палаты предпринимателей Республики Казахстан «Атамекен» №222 от 05.12.2022), стандартов  WorldSkills Сетевое и системное администрирование для специальности «06120100 «Вычислительная техника и информационные сети» (по видам)» и квалификации 4S06120102 «Техник сетевого и системного администрирования».\",\n\t\t\"goals\": \"Целью освоения профессионального модуля является обеспечение студентов навыками эффективного обслуживания, настройки и обеспечения информационной безопасности локальных вычислительных сетей и Internet. Данный модуль даёт студентам знания об архитектуре и компонентах локальных вычислительных сетей, мониторинге уязвимостей информации, принципах их работы и основных компонентах. Кроме того, студенты осваивают такие навыки, как настраивать и конфигурировать средства защиты ЛВС, анализировать угрозы и уязвимости, реализовать меры защиты информации, обновление, устранение неполадок, установка и администирование процесс управления безопасностью сетевых устройств и программного обеспечения.\",\n\t\t\"summary\": \"\",\n\t\t\"competencies\": \"Формируемые компетенции: Владеть методами и средствами обеспечения безопасности локальных сетей и подключенных к ним ресурсов с соблюдением требований охраны труда и техники безопасности; установка и управление ресурсами программного обеспечения и операционных систем.\",\n\n\t\t\"prerequisites\": \"ПМ5 Администрирование процесса установки сетевых устройств инфокоммуникационных систем\",\n\t\t\"postrequisites\": \"ПМ7 Управление системами и сетями организации.\",\n\n\t\t\"internetResources\": [\n\t\t\t{\n\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\"name\": \"Электронный учебно-методический комплекс «Введение в сетевые технологии» курса CCNA сетевой академии Cisco\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\"name\": \"Б. В. Левин, А. В. Левина, А. А. Кириллов. «Информационная безопасность сети». Подробное объяснение принципов, технологий и методов защиты сетей.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\"name\": \"Электронный учебно-методический комплекс «Основы маршрутизации и коммутации» курса CCNA сетевой академии Cisco.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\"name\": \"Книга: Джон Э. Митник, Хорси Разен. «Искусство скрывать следы. Hacking Exposed: Network Security Secrets & Solutions». Практическое руководство по методам защиты и атакам на сети, обзор популярных уязвимостей, методы защиты\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\"name\": \"Книга: А. Черных, Ю. Степанов, В. Звонков. «Безопасность локальных сетей», конкретные методы обеспечения безопасности ЛВС, типовые угрозы и меры противодействия.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\"name\": \"Учебное пособие: Под редакцией А. М. Павловского «Основы информационной безопасности», общие принципы ИБ, стандарты, правовые и организационные аспекты.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\"name\": \"Стандарты ISO/IEC 27001 и 27002 — международные стандарты по управлению информационной безопасностью\",\n\t\t\t\t\"link\": \"\"\n\t\t\t}\n\t\t],\n\t\t\"technicalResources\": [\n\t\t\t{\n\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\"name\": \"Программное обеспечение:, Open Source инструменты: документация по использованию Snort, Wireshark для анализа сетевого трафика и обнаружения угроз.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\"name\": \"Операционные системы: Windows, Linux, macOS.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\"name\": \"Технические средства: компьютеры, мультимедийные проекторы, необходимые инструменты и аксессуары.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\"name\": \"Цифровые образовательные ресурсы.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\"name\": \"Комплексы тестов.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t}\n\t\t]\n\t},\n\n\t\"disciplines\": [\n\t\t{\n\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\"name\": \"Проводить мониторинг сетевой безопасности организации\",\n\t\t\t\"code\": \"РО6.1\",\n\t\t\t\"totalHours\": 72,\n\t\t\t\"semesters\": [\n\t\t\t\t{\n\t\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\t\"semester\": 1,\n\t\t\t\t\t\"totalHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\t\"semester\": 2,\n\t\t\t\t\t\"totalHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\t\"semester\": 3,\n\t\t\t\t\t\"totalHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\t\"semester\": 4,\n\t\t\t\t\t\"totalHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\t\"semester\": 5,\n\t\t\t\t\t\"totalHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\t\"semester\": 6,\n\t\t\t\t\t\"totalHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\t\"semester\": 7,\n\t\t\t\t\t\"totalHours\": 72\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\t\"semester\": 8,\n\t\t\t\t\t\"totalHours\": 0\n\t\t\t\t}\n\t\t\t],\n\t\t\t\"topics\": [\n\t\t\t\t{\n\t\t\t\t\t\"id\": \"asd23f-fresdv-grv32c-carca\",\n\t\t\t\t\t\"name\": \"Использует понятия и классификацию угроз ИБ. Распознает угрозы информационной безопасности 02,09\",\n\t\t\t\t\t\"type\": \"COMBINED\",\n\n\t\t\t\t\t\"totalHours\": 2,\n\t\t\t\t\t\"theoryHours\": 