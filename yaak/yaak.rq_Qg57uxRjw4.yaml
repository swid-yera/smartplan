  text: |-
    {
      "name": "Обеспечение информационной безопасности локальных вычислительных сетей и Internet",
      "code": "ПМ6",
      "type": "PRACTICE",
      "course": 4,
      "studyForm": "FULL_TIME",
      "studyYear": "2025-2026",
      "groups": [
        "e6eff862-03f0-4852-821c-a190f83420d5"
      ],
      "explorationNote": {
        "basis": "Рабочая учебная программа по профессиональному модулю «ПМ6 Обеспечение информационной безопасности локальных вычислительных сетей и Internet» разработана на основе Приказа Министра просвещения Республики Казахстан от 3 августа 2022 года № 348 учитывая внесенные изменения от 15.04.2025 года, профессиональных стандартов ««Сетевые, системные администраторы и администраторы серверов» (дополнение №5 к приказу заместителя председателя правления Национальной палаты предпринимателей Республики Казахстан «Атамекен» №222 от 05.12.2022), стандартов  WorldSkills Сетевое и системное администрирование для специальности «06120100 «Вычислительная техника и информационные сети(по видам)» и квалификации 4S06120102 «Техник сетевого и системного администрирования».",
        "goals": "Целью освоения профессионального модуля является обеспечение студентов навыками эффективного обслуживания, настройки и обеспечения информационной безопасности локальных вычислительных сетейи Internet. Данный модуль даёт студентам знания об архитектуре и компонентах локальных вычислительных сетей, мониторинге уязвимостей информации, принципах их работы и основных компонентах. Кроме того, студенты осваивают такие навыки, как настраивать и конфигурировать средства защиты ЛВС, анализировать угрозы и уязвимости, реализовать меры защиты информации, обновление, устранение неполадок, установка и администирование процесс управления безопасностью сетевых устройств и программного обеспечения.",
        "competencies": "Владеть методами и средствами обеспечения безопасности локальных сетей и подключенных к ним ресурсов с соблюдением требований охраны труда и техники безопасности; установка и управление ресурсами программного обеспечения и операционных систем",
        "summary": "Это краткое содержание",
        "prerequisites": "ПМ5 Администрирование процессами установки сетевых устройств инфокоммуникационных систем",
        "postrequisites": "ПМ7 Управление системами и сетями организации.",
        "internetResources": [
          {
            "name": "Электронный учебно-методический комплекс «Введение в сетевые технологии» курса CCNA сетевой академии Cisco",
            "link": ""
          },
          {
            "name": "Электронный учебно-методический комплекс «Основы маршрутизации и коммутации» курса CCNA сетевой академии Cisco",
            "link": ""
          },
          {
            "name": "Б.В.Левин, А.В.Левина, А.А.Кириллов. «Информационная безопасность сети». Подробное объяснение принципов, технологий и методов защиты сетей",
            "link": ""
          }
        ],
        "technicalResources": [
          {
            "name": "Программноеобеспечение: OpenSource инструменты: документация по использованию Snort, Wireshark для анализа сетевого трафика и обнаружения угроз",
            "link": ""
          },
          {
            "name": "Операционные системы: Windows, Linux, macOS",
            "link": ""
          }
        ]
      },
