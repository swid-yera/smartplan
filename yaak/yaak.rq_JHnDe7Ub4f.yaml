body:
  text: "{\n\t\"name\": \"Обеспечение информационной безопасности локальных вычислительных сетей и Internet\",\n  \"code\": \"ПМ6\",\n\t\"course\": 4,\n\t\"studyForm\": \"FULL_TIME\",\n\t\"studyYear\": \"2025-2026\",\n\t\"type\": \"PRACTICE\",\n\t\"contacts\": [\"720447e1-3bab-4aa1-9704-f3366fd50cdd\"],\n\t\"groups\": [\"8965a3b6-cde2-483c-8606-6b31a3ac0764\"],\n\t\"methodist\": \"\",\n    \"teacher\": \"720447e1-3bab-4aa1-9704-f3366fd50cdd\",\n\t\"explorationNote\": {\n\t\t\"basis\": \"Рабочая учебная программа по профессиональному модулю «ПМ6 Обеспечение информационной безопасности локальных вычислительных сетей и Internet» разработана на основе Приказа Министра просвещения Республики Казахстан от 3 августа 2022 года № 348 учитывая внесенные изменения от 15.04.2025 года, профессиональных стандартов ««Сетевые, системные администраторы и администраторы серверов» (дополнение №5 к приказу заместителя председателя правления Национальной палаты предпринимателей Республики Казахстан «Атамекен» №222 от 05.12.2022), стандартов  WorldSkills Сетевое и системное администрирование для специальности «06120100 «Вычислительная техника и информационные сети» (по видам)» и квалификации 4S06120102 «Техник сетевого и системного администрирования».\",\n\t\t\"goals\": \"Целью освоения профессионального модуля является обеспечение студентов навыками эффективного обслуживания, настройки и обеспечения информационной безопасности локальных вычислительных сетей и Internet. Данный модуль даёт студентам знания об архитектуре и компонентах локальных вычислительных сетей, мониторинге уязвимостей информации, принципах их работы и основных компонентах. Кроме того, студенты осваивают такие навыки, как настраивать и конфигурировать средства защиты ЛВС, анализировать угрозы и уязвимости, реализовать меры защиты информации, обновление, устранение неполадок, установка и администирование процесс управления безопасностью сетевых устройств и программного обеспечения.\",\n\t\t\"competencies\": \"Формируемые компетенции: Владеть методами и средствами обеспечения безопасности локальных сетей и подключенных к ним ресурсов с соблюдением требований охраны труда и техники безопасности; установка и управление ресурсами программного обеспечения и операционных систем.\",\n\n\t\t\"prerequisites\": \"ПМ5 Администрирование процесса установки сетевых устройств инфокоммуникационных систем\",\n\t\t\"postrequisites\": \"ПМ7 Управление системами и сетями организации.\",\n\n\t\t\"internetResources\": [\n\t\t\t{\n\t\t\t\t\"name\": \"Электронный учебно-методический комплекс «Введение в сетевые технологии» курса CCNA сетевой академии Cisco\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"name\": \"Б. В. Левин, А. В. Левина, А. А. Кириллов. «Информационная безопасность сети». Подробное объяснение принципов, технологий и методов защиты сетей.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"name\": \"Электронный учебно-методический комплекс «Основы маршрутизации и коммутации» курса CCNA сетевой академии Cisco.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t}\n\t\t],\n\t\t\"technicalResources\": [\n\t\t\t{\n\t\t\t\t\"name\": \"Программное обеспечение:, Open Source инструменты: документация по использованию Snort, Wireshark для анализа сетевого трафика и обнаружения угроз.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"name\": \"Операционные системы: Windows, Linux, macOS.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"name\": \"Технические средства: компьютеры, мультимедийные проекторы, необходимые инструменты и аксессуары.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t},\n\t\t\t{\n\t\t\t\t\"name\": \"Цифровые образовательные ресурсы.\",\n\t\t\t\t\"link\": \"\"\n\t\t\t}\n\t\t]\n\t},\n\n\t\"disciplines\": [\n\t\t{\n\t\t\t\"name\": \"Проводить мониторинг сетевой безопасности организации\",\n\t\t\t\"code\": \"РО6.1\",\n\t\t\t\"semesters\": [\n\t\t\t\t{\n\t\t\t\t\t\"semester\": 1,\n\t\t\t\t\t\"totalHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"semester\": 2,\n\t\t\t\t\t\"totalHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"semester\": 3,\n\t\t\t\t\t\"totalHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"semester\": 4,\n\t\t\t\t\t\"totalHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"semester\": 5,\n\t\t\t\t\t\"totalHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"semester\": 6,\n\t\t\t\t\t\"totalHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"semester\": 7,\n\t\t\t\t\t\"totalHours\": 72\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"semester\": 8,\n\t\t\t\t\t\"totalHours\": 0\n\t\t\t\t}\n\t\t\t],\n\t\t\t\"topics\": [\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"Использует понятия и классификацию угроз ИБ. Распознает угрозы информационной безопасности 02,09\",\n\t\t\t\t\t\"type\": \"COMBINED\",\n\t\t\t\t\t\"theoryHours\": 2,\n\t\t\t\t\t\"practiceHours\": 0,\n\t\t\t\t\t\"individualHours\": 0,\n\t\t\t\t\t\"srspHours\": 0,\n\t\t\t\t\t\"srsHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"Использует основные внешние и внутренние угрозы: примеры атак03,09\",\n\t\t\t\t\t\"type\": \"COMBINED\",\n\t\t\t\t\t\"theoryHours\": 2,\n\t\t\t\t\t\"practiceHours\": 0,\n\t\t\t\t\t\"individualHours\": 0,\n\t\t\t\t\t\"srspHours\": 0,\n\t\t\t\t\t\"srsHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"Понимает актуальные угрозы для сетевых устройств и ПО04,09\",\n\t\t\t\t\t\"type\": \"COMBINED\",\n\t\t\t\t\t\"theoryHours\": 2,\n\t\t\t\t\t\"practiceHours\": 0,\n\t\t\t\t\t\"individualHours\": 0,\n\t\t\t\t\t\"srspHours\": 0,\n\t\t\t\t\t\"srsHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"Разбирает современные кибератаки (фишинг, соц. инженерия, DDoS)05,09\",\n\t\t\t\t\t\"type\": \"COMBINED\",\n\t\t\t\t\t\"theoryHours\": 2,\n\t\t\t\t\t\"practiceHours\": 0,\n\t\t\t\t\t\"individualHours\": 0,\n\t\t\t\t\t\"srspHours\": 0,\n\t\t\t\t\t\"srsHours\": 0\n\t\t\t\t},\n\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"№1 Анализирует реальные кейсы киберинцидентов08,09\",\n\t\t\t\t\t\"type\": \"PRACTICAL\",\n\t\t\t\t\t\"theoryHours\": 0,\n\t\t\t\t\t\"practiceHours\": 2,\n\t\t\t\t\t\"individualHours\": 0,\n\t\t\t\t\t\"srspHours\": 0,\n\t\t\t\t\t\"srsHours\": 0\n\t\t\t\t},\n\t\t\t\t{\n\t\t\t\t\t\"name\": \"№2Работает с примерами вредоносных программ08,09\",\n\t\t\t\t\t\"type\": \"PRACTICAL\",\n\t\t\t\t\t\"theoryHours\": 0,\n\t\t\t\t\t\"practiceHours\": 2,\n\t\t\t\t\t\"individualHours\": 0,\n\t\t\t\t\t\"srspHours\": 0,\n\t\t\t\t\t\"srsHours\": 0\n\t\t\t\t}\n\t\t\t]\n\t\t}\n\t],\n\n\t\"created_at\": \"252982342\",\n\t\"updated_at\": \"252982342\"\n}\n"
